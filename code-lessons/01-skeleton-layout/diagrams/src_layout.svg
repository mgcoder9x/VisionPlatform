<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="590" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">src layout + cách ly test (Bài #01 · mẩu 02)</text>

  <!-- root -->
  <rect x="40" y="48" width="640" height="340" rx="4" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="360" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Dự án: vision-platform/  (Root)</text>

  <!-- pyproject -->
  <rect x="275" y="80" width="170" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="360" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3c66">pyproject.toml</text>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="#1a3c66">(cấu hình + metadata)</text>

  <!-- src box -->
  <rect x="70" y="170" width="250" height="195" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="195" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d">src/  (mã nguồn chính)</text>
  <rect x="95" y="205" width="200" height="140" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="195" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b2e5e">vision_platform/</text>
  <text x="195" y="266" text-anchor="middle" font-size="11" fill="#4b2e5e">__init__.py + 6 tầng</text>
  <text x="195" y="290" text-anchor="middle" font-size="10" fill="#4b2e5e">domain · kernel · runtime</text>
  <text x="195" y="305" text-anchor="middle" font-size="10" fill="#4b2e5e">application · adapters · profiles</text>

  <!-- tests box -->
  <rect x="400" y="170" width="250" height="195" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="525" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5300">tests/  (nằm NGOÀI src/)</text>
  <rect x="425" y="215" width="200" height="80" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="525" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5500">test_smoke.py</text>
  <text x="525" y="266" text-anchor="middle" font-size="11" fill="#6b5500">import vision_platform</text>

  <!-- venv box -->
  <rect x="210" y="415" width="300" height="120" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="360" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2e2c">Môi trường ảo: .venv/  (cô lập thư viện)</text>
  <rect x="270" y="450" width="180" height="60" rx="6" fill="#e51400" stroke="#b20000" stroke-width="2"/>
  <text x="360" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">python.exe</text>
  <text x="360" y="492" text-anchor="middle" font-size="11" fill="#ffffff">(chạy tests + app)</text>

  <!-- arrows -->
  <!-- pyproject -> src -->
  <line x1="320" y1="136" x2="230" y2="170" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="158" font-size="10" fill="#1a3c66">where = ["src"]</text>
  <!-- test -> pkg (import) -->
  <line x1="425" y1="255" x2="297" y2="255" stroke="#d79b00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="305" y="232" font-size="10" fill="#7a5300">import (qua link .venv)</text>
  <!-- python -> pkg (editable) -->
  <line x1="295" y1="450" x2="210" y2="346" stroke="#b85450" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="410" font-size="10" fill="#7a2e2c">pip install -e .[dev] → link editable tới src/</text>

  <text x="40" y="560" font-size="11" fill="#666">Ý nghĩa: code trong src/ nên PHẢI cài (pip install -e) mới import được.</text>
  <text x="40" y="577" font-size="11" fill="#666">Test nằm ngoài src/ → chạy như người dùng thật, lộ lỗi đóng gói sớm.</text>
</svg>
